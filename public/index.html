<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revo Bot - تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #090b1d;
      font-family: 'Tajawal', sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(180px);
      opacity: 0.12;
      pointer-events: none;
    }
    .bg-glow-1 { background: #9e65ff; top: -150px; left: -150px; }
    .bg-glow-2 { background: #5534d9; bottom: -150px; right: -150px; }

    .login-box {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 50px 40px;
      background: rgba(13, 16, 39, 0.9);
      border: 1px solid #25274c;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      max-width: 420px;
      width: 92%;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #9e65ff, #5534d9);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(119, 74, 255, 0.45);
    }

    .logo-icon svg { width: 28px; height: 28px; color: #fff; }

    .logo-text h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .logo-text h1 span { color: #9062ff; }

    .subtitle {
      color: #676b99;
      font-size: 13px;
      margin-bottom: 36px;
    }

    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 36px;
    }

    .feature-card {
      background: rgba(25, 27, 64, 0.5);
      border: 1px solid #25274c;
      border-radius: 10px;
      padding: 14px 10px;
      text-align: center;
    }

    .feature-card .icon {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .feature-card h3 {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .feature-card p {
      font-size: 9px;
      color: #676b99;
    }

    .discord-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 28px;
      background: #5865f2;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
      text-decoration: none;
    }

    .discord-btn:hover {
      background: #4752c4;
    }

    .discord-btn svg { width: 22px; height: 22px; }

    .footer {
      margin-top: 20px;
      color: #3d3f6b;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="login-box">
    <div class="logo">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 8V4H8"></path>
          <rect width="16" height="12" x="4" y="8" rx="2"></rect>
          <path d="M2 14h2"></path>
          <path d="M20 14h2"></path>
          <path d="M15 13v2"></path>
          <path d="M9 13v2"></path>
        </svg>
      </div>
      <div class="logo-text">
        <h1>REVO <span>BOT</span></h1>
      </div>
    </div>

    <p class="subtitle">مجتمعك، بإدارة أذكى</p>

    <div class="features">
      <div class="feature-card">
        <div class="icon">💰</div>
        <h3>نظام اقتصادي</h3>
        <p>تحويلات، مكافآت، متجر</p>
      </div>
      <div class="feature-card">
        <div class="icon">🛡️</div>
        <h3>حماية السيرفر</h3>
        <p>17 نظام حماية</p>
      </div>
      <div class="feature-card">
        <div class="icon">🎫</div>
        <h3>نظام التذاكر</h3>
        <p>12 لوحة تذاكر</p>
      </div>
      <div class="feature-card">
        <div class="icon">📊</div>
        <h3>إحصائيات</h3>
        <p>مراقبة شاملة</p>
      </div>
    </div>

    <a href="/auth/login" class="discord-btn">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286z"/>
      </svg>
      تسجيل الدخول عبر Discord
    </a>

    <p class="footer">بوت إدارة المجتمع الأذكى في عرب</p>
  </div>

  <script>
    fetch('/api/check').then(r => r.json()).then(d => {
      if (d.authenticated) window.location.href = '/dashboard.html';
    });
  </script>
</body>
</html>
