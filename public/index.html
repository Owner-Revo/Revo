<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revo • Control Center</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body class="login-page"><div class="space-bg"><i></i><i></i><i></i><i></i><i></i></div><main class="login-card"><div class="login-logo">R</div><span class="eyebrow">REVO BOT • CONTROL CENTER</span><h1>إدارة سيرفرك<br><em>بشكل مختلف.</em></h1><p>لوحة تحكم احترافية تربط أنظمة Revo مباشرة بإعدادات سيرفرك.</p><div class="login-user" id="loginUser" hidden><img id="loginUserAvatar"><div><small>أنت مسجل الدخول</small><b id="loginUserName">—</b></div></div><div class="login-actions"><a class="primary-btn" id="loginBtn" href="/auth/login">تسجيل الدخول عبر Discord</a><a class="ghost-btn" id="dashboardBtn" href="/dashboard.html" hidden>فتح لوحة التحكم</a><a class="ghost-btn" href="https://discord.gg/GxHJZaZDZt" target="_blank" rel="noreferrer">سيرفر الدعم</a><a class="ghost-btn" href="/auth/add-bot">إضافة Revo لسيرفرك</a></div><div class="login-trust"><span>OAuth آمن</span><span>إعدادات مباشرة</span><span>Space UI</span></div></main><script>fetch('/api/check',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{if(!d.authenticated)return;const box=document.getElementById('loginUser'),av=document.getElementById('loginUserAvatar'),name=document.getElementById('loginUserName'),login=document.getElementById('loginBtn'),dash=document.getElementById('dashboardBtn');box.hidden=false;name.textContent=d.user?.globalName||d.user?.username||'Discord User';if(d.user?.avatar)av.src=d.user.avatar;login.textContent='تسجيل الدخول بحساب آخر';dash.hidden=false}).catch(()=>{});</script></body></html>
